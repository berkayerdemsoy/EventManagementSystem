# ─── Test profili: Mail mock ──────────────────────────────────────────────────
# Kafka exclusion → NotificationServiceApplicationTests @ImportAutoConfiguration ile yapılıyor

spring:
  # Mail bağlantı denemesi yapmasın — test ortamında SMTP yok
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

management:
  health:
    mail:
      enabled: false   # Mail health check kapalı
