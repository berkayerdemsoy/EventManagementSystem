version: '3.8'

services:

  # ─── Docker Socket Proxy: Traefik'e sadece okuma izni verir ──────────────────
  # Traefik ele geçirilse bile Docker daemon'a tam erişim sağlanamaz.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    environment:
      CONTAINERS: 1   # container label okuma — Traefik discovery için gerekli
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      VOLUMES: 0
      POST: 0         # yazma işlemleri tamamen kapalı
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-network
    restart: unless-stopped

  # ─── Traefik: Sınır Güvenliği, SSL ve HTTP→HTTPS Yönlendirme ─────────────────
  traefik:
    image: traefik:v3.0
    container_name: traefik
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375   # socket yerine proxy üzerinden bağlan
    command:
      - "--api.dashboard=false"                                        # Dashboard kapalı (güvenlik)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure" # HTTP → HTTPS yönlendirme
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # docker.sock artık burada yok — socket-proxy üzerinden erişiliyor
      - "./letsencrypt:/letsencrypt"
    networks:
      - microservices-network
      - socket-proxy-network
    depends_on:
      - socket-proxy
    restart: unless-stopped

  # ─── Frontend (Angular — nginx) ──────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GHCR_USERNAME}/ems-ng:latest
    container_name: ems-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`akissy.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── Eureka: Servis Keşfi (sadece iç ağ) ─────────────────────────────────────
  eureka-server:
    image: ghcr.io/${GHCR_USERNAME}/eurekaserver:latest
    container_name: eurekaserver
    environment:
      EUREKA_HOSTNAME: eureka-server
      SERVER_PORT: 8761
      EUREKA_ADMIN_USERNAME: ${EUREKA_ADMIN_USERNAME}
      EUREKA_ADMIN_PASSWORD: ${EUREKA_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── Veritabanları: Sadece iç ağ ─────────────────────────────────────────────
  user-service-db:
    image: postgres:17-alpine
    container_name: user-service-db
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - user-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - microservices-network
    restart: unless-stopped

  event-service-db:
    image: postgres:17-alpine
    container_name: event-service-db
    environment:
      POSTGRES_DB: event_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}
    volumes:
      - event-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── Kafka (KRaft — Zookeeper'sız) ───────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}           # .env → openssl rand -hex 16 ile üret
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── API Gateway: Traefik üzerinden dış dünyaya açılır ───────────────────────
  api-gateway:
    image: ghcr.io/${GHCR_USERNAME}/api-gateway:latest
    container_name: ems-api-gateway
    environment:
      SERVER_PORT: 8090
      EUREKA_USERNAME: ${EUREKA_ADMIN_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_ADMIN_PASSWORD}
      EUREKA_HOST: eureka-server
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}   # .env → örn: https://akissy.com
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.akissy.com`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=myresolver"
      - "traefik.http.services.gateway.loadbalancer.server.port=8090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── User Service ─────────────────────────────────────────────────────────────
  user-service:
    image: ghcr.io/${GHCR_USERNAME}/user-service:latest
    container_name: ems-user-service
    expose:
      - "8080"
      - "9090"   # gRPC — sadece iç ağ
    environment:
      SERVER_PORT: 8080
      GRPC_PORT: 9090
      DB_HOST: user-service-db
      DB_PORT: 5432
      DB_NAME: user_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_USERNAME: ${EUREKA_ADMIN_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_ADMIN_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES}
      ADMIN_PASSWORDS: ${ADMIN_PASSWORDS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}   # user-service için
      FRONTEND_URL: ${FRONTEND_URL:-https://akissy.com} # e-posta linkleri için
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── Event Service ────────────────────────────────────────────────────────────
  event-service:
    image: ghcr.io/${GHCR_USERNAME}/event-service:latest
    container_name: ems-event-service
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: event-service-db
      DB_PORT: 5432
      DB_NAME: event_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${EVENT_DB_PASSWORD}
      EUREKA_USERNAME: ${EUREKA_ADMIN_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_ADMIN_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      eureka-server:
        condition: service_healthy
      event-service-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # ─── Notification Service ─────────────────────────────────────────────────────
  notification-service:
    image: ghcr.io/${GHCR_USERNAME}/notification-service:latest
    container_name: ems-notification-service
    environment:
      SERVER_PORT: 8083
      KAFKA_BROKERS: kafka:29092
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

volumes:
  user-service-db-data:
  event-service-db-data:

networks:
  microservices-network:
    driver: bridge
  socket-proxy-network:   # izole ağ: sadece traefik + socket-proxy erişebilir
    driver: bridge
    internal: true         # dış dünyaya çıkış yok
