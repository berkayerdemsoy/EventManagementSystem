databaseChangeLog:

  # ─────────────────────────────────────────────────────────────────────────────
  # ChangeSet 1 — Tablo: categories
  # Entity: com.example.event_service_app.entity.Category
  # @Table(name = "categories")
  # ─────────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "v1.0.0-1-create-categories-table"
      author: ems
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              # @Column(nullable = false, unique = true)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_categories_name

  # ─────────────────────────────────────────────────────────────────────────────
  # ChangeSet 2 — Tablo: events
  # Entity: com.example.event_service_app.entity.Event
  # @Table(name = "events")
  # ─────────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "v1.0.0-2-create-events-table"
      author: ems
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              # @Column(nullable = false)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(nullable = false)
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false

              # @Column(nullable = false)  — denormalized, user-service'e FK yok
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false

              # @Column(nullable = false)  — denormalized
              - column:
                  name: owner_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(nullable = false)
              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              # @Column(nullable = false)
              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(nullable = false)
              - column:
                  name: capacity
                  type: BIGINT
                  constraints:
                    nullable: false

              # private Long currentAttendees = 0L  — nullable=false yok, default 0
              - column:
                  name: current_attendees
                  type: BIGINT
                  defaultValueNumeric: 0

              # @Column(nullable = false)
              - column:
                  name: price
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false

              # @Enumerated(EnumType.STRING) — EventStatus: UPCOMING|ONGOING|COMPLETED|CANCELLED
              # default = EventStatus.UPCOMING
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: UPCOMING

              # @ManyToOne — FK → categories.id  (nullable, category_id)
              - column:
                  name: category_id
                  type: BIGINT

              # nullable — set by application
              - column:
                  name: start_date
                  type: TIMESTAMP WITHOUT TIME ZONE

              # nullable
              - column:
                  name: end_date
                  type: TIMESTAMP WITHOUT TIME ZONE

              # @Column(name = "created_at", updatable = false)  — set by @PrePersist
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE

              # @Column(name = "updated_at")  — set by @PrePersist / @PreUpdate
              - column:
                  name: updated_at
                  type: TIMESTAMP WITHOUT TIME ZONE

        # FK: events.category_id → categories.id
        - addForeignKeyConstraint:
            constraintName: fk_events_category_id
            baseTableName: events
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id

  # ─────────────────────────────────────────────────────────────────────────────
  # ChangeSet 3 — Tablo: participations
  # Entity: com.example.event_service_app.entity.Participation
  # @Table(name = "participations",
  #        uniqueConstraints = @UniqueConstraint(columnNames = {"event_id","participant_id"}))
  # ─────────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "v1.0.0-3-create-participations-table"
      author: ems
      changes:
        - createTable:
            tableName: participations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              # @JoinColumn(name = "event_id", nullable = false)
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false

              # @Column(name = "participant_id", nullable = false)  — denormalized, user-service'e FK yok
              - column:
                  name: participant_id
                  type: BIGINT
                  constraints:
                    nullable: false

              # @Column(name = "participant_email", nullable = false)
              - column:
                  name: participant_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(name = "registered_at", nullable = false, updatable = false)
              - column:
                  name: registered_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              # @Column(name = "reminder_sent", nullable = false)  default = false
              - column:
                  name: reminder_sent
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        # FK: participations.event_id → events.id
        - addForeignKeyConstraint:
            constraintName: fk_participations_event_id
            baseTableName: participations
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id

        # @UniqueConstraint(columnNames = {"event_id", "participant_id"})
        - addUniqueConstraint:
            constraintName: uq_participations_event_participant
            tableName: participations
            columnNames: event_id, participant_id

