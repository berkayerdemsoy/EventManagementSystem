databaseChangeLog:

  # ─────────────────────────────────────────────────────────────────────────────
  # ChangeSet 1 — Tablo: outbox_events
  # Entity: com.example.event_service_app.entity.OutboxEvent
  # @Table(name = "outbox_events")
  #
  # Amaç: Transactional Outbox Pattern için gönderilecek domain event'ları
  #       güvenli bir şekilde saklamak. İşlem başarılı olduktan sonra
  #       OutboxRelay bu kayıtları Kafka'ya iletir.
  # ─────────────────────────────────────────────────────────────────────────────
  - changeSet:
      id: "v1.0.3-1-create-outbox-events-table"
      author: ems
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              # @Id @GeneratedValue(strategy = GenerationType.IDENTITY)
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              # @Column(name = "aggregate_type", nullable = false)
              - column:
                  name: aggregate_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(name = "aggregate_id", nullable = false)
              - column:
                  name: aggregate_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(name = "event_type", nullable = false)
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              # @Column(nullable = false, columnDefinition = "TEXT")
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              # @Column(name = "created_at", nullable = false)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

              # @Column(nullable = false)
              - column:
                  name: processed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        # Relay sorgusunu hızlandırmak için: processed=false kayıtları created_at sırasına göre çek
        - createIndex:
            indexName: idx_outbox_events_processed_created_at
            tableName: outbox_events
            columns:
              - column:
                  name: processed
              - column:
                  name: created_at
