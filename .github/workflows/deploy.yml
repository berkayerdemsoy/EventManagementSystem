name: CI/CD Pipeline

# ─── Tetikleyiciler ────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─── Ortam değişkenleri ────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  # GHCR_USERNAME → GitHub repo variable olarak tanımla (Settings > Variables > Actions)
  # Secrets'a değil Variables'a koy; kullanıcı adı gizli değil.

# ─── İzinler ──────────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write   # GHCR'a push için

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. TEST — Her push ve PR'da paralel çalışır
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Test / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            path: EurekaServer
            needs_github_pkg: false
          - service: api-gateway
            path: api-gateway
            needs_github_pkg: false
          - service: user-service
            path: UserService/user-service-app
            needs_github_pkg: true
          - service: event-service
            path: event-service/event-service-app
            needs_github_pkg: true
          - service: notification-service
            path: notification-service
            needs_github_pkg: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # settings.xml: token Maven'ın ${env.GITHUB_TOKEN} interpolasyonu ile
      # çözülür — değer asla log'a düşmez, GITHUB_TOKEN otomatik maskelenir.
      - name: Configure Maven settings (GitHub Packages)
        if: matrix.needs_github_pkg
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS_EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS_EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      # user-service-client'ı test öncesi local repo'ya kur
      - name: Install user-service-client (user-service dep)
        if: matrix.service == 'user-service'
        working-directory: UserService/user-service-client
        run: mvn clean install -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install user-service-client (event-service dep)
        if: matrix.service == 'event-service'
        working-directory: UserService/user-service-client
        run: mvn clean install -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Install event-service-client (event-service dep)
        if: matrix.service == 'event-service'
        working-directory: event-service/event-service-client
        run: mvn clean install -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: mvn test -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. BUILD & PUSH — Sadece main branch push'unda, testler geçince
  # ═══════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push / ${{ matrix.service }}
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eurekaserver
            dockerfile: EurekaServer/Dockerfile
            context: ./EurekaServer
            needs_secret: false
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: ./api-gateway
            needs_secret: false
          - service: user-service
            dockerfile: UserService/Dockerfile
            context: ./UserService
            needs_secret: true
          - service: event-service
            dockerfile: event-service/Dockerfile
            context: .
            needs_secret: true
          - service: notification-service
            dockerfile: notification-service/Dockerfile
            context: ./notification-service
            needs_secret: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── BuildKit secret mount: token image history'ye YAZILMAZ ──────────────
      - name: Build & push (with GitHub Packages secret)
        if: matrix.needs_secret
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GHCR_USERNAME }}/${{ matrix.service }}:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
            github_actor=${{ github.actor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (no secrets needed)
        if: "!matrix.needs_secret"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GHCR_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. DEPLOY — Compose dosyasını kopyala, sunucuda pull+up yap
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docker-compose-prod.yml'i sunucuya kopyala
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose-prod.yml
          target: /opt/ems/

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # acme.json: Traefik chmod 600 ister; idempotent
            mkdir -p /opt/ems/letsencrypt
            if [ ! -f /opt/ems/letsencrypt/acme.json ]; then
              touch /opt/ems/letsencrypt/acme.json
            fi
            chmod 600 /opt/ems/letsencrypt/acme.json

            # GHCR'a giriş — GHCR_TOKEN secret'ından alınan PAT (read:packages)
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            cd /opt/ems

            # Güncel image'ları çek ve servisleri yeniden başlat
            docker compose -f docker-compose-prod.yml pull
            docker compose -f docker-compose-prod.yml up -d --remove-orphans

            # Eski/kullanılmayan image'ları temizle
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
