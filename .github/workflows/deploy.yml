name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-push:
    name: Build & Push / ${{ matrix.service }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - service: eurekaserver
            dockerfile: EurekaServer/Dockerfile
            context: ./EurekaServer
            needs_secret: false
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: ./api-gateway
            needs_secret: false
          - service: user-service
            dockerfile: UserService/Dockerfile
            context: ./UserService
            needs_secret: true
          - service: event-service
            dockerfile: event-service/Dockerfile
            context: ./event-service   # DÜZELTİLDİ: '.' yerine spesifik klasör
            needs_secret: true
          - service: notification-service
            dockerfile: notification-service/Dockerfile
            context: ./notification-service
            needs_secret: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Değişiklik Kontrolü ──────────────────────────────────────────────
      # Sadece matrix.context (ilgili servisin klasörü) içinde değişiklik varsa
      # "changed" çıktısını true yapar.
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.context }}/**'

      # ── 2. Build Adımları (Sadece değişiklik varsa çalışır) ────────────────
      - name: Set up Docker Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push (with GitHub Packages secret)
        if: steps.filter.outputs.changed == 'true' && matrix.needs_secret
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GHCR_USERNAME }}/${{ matrix.service }}:latest
          secrets: |
            github_token=${{ secrets.GHCR_TOKEN }}
            github_actor=${{ github.actor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (no secrets needed)
        if: steps.filter.outputs.changed == 'true' && !matrix.needs_secret
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GHCR_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: emsadmin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -e
            mkdir -p /opt/ems/letsencrypt
            if [ ! -f /opt/ems/letsencrypt/acme.json ]; then
              touch /opt/ems/letsencrypt/acme.json
            fi
            chmod 600 /opt/ems/letsencrypt/acme.json
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd /opt/ems
            docker-compose -f docker-compose-prod.yml --env-file .env pull
            docker-compose -f docker-compose-prod.yml --env-file .env up -d --remove-orphans
            docker image prune -f