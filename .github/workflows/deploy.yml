name: CI/CD — Test, Build, Push & Deploy

# ─── Tetikleyiciler ────────────────────────────────────────────────────────────
on:
  push:
    branches: ['**']        # Her branch'e push → testler çalışır
  pull_request:
    branches: [ main ]      # PR açıldığında / güncellendiğinde → testler çalışır

# ─── Genel değişkenler ────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

# ─── İzinler ──────────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — TEST (Her branch'e push'ta çalışır — CI'ın kalbi)
  # GitHub Packages'tan ems-common çekebilmek için GITHUB_TOKEN kullanılır.
  # ════════════════════════════════════════════════════════════════════════════
  test-eureka:
    name:  Test — eureka-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: ./EurekaServer
        run: mvn test -B

  test-api-gateway:
    name:  Test — api-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: ./api-gateway
        run: mvn test -B

  # GitHub Packages'tan ems-common çekilen servisler için settings.xml oluşturulur
  test-user-service:
    name:  Test — user-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Configure GitHub Packages auth
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      # user-service-client önce install edilmeli (app buna bağımlı)
      - name: Install user-service-client
        working-directory: ./UserService/user-service-client
        run: mvn install -DskipTests -B
      - name: Run user-service-app tests
        working-directory: ./UserService/user-service-app
        run: mvn test -B

  test-event-service:
    name:  Test — event-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Configure GitHub Packages auth
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Install user-service-client (event-service depends on it)
        working-directory: ./UserService/user-service-client
        run: mvn install -DskipTests -B
      - name: Install event-service-client
        working-directory: ./event-service/event-service-client
        run: mvn install -DskipTests -B
      - name: Run event-service-app tests
        working-directory: ./event-service/event-service-app
        run: mvn test -B

  test-notification-service:
    name:  Test — notification-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Configure GitHub Packages auth
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Run tests
        working-directory: ./notification-service
        run: mvn test -B

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — BUILD & PUSH (Sadece main branch, testler geçince)
  # ════════════════════════════════════════════════════════════════════════════
  build-eureka:
    name:  Build & Push — eureka-server
    runs-on: ubuntu-latest
    needs: [test-eureka]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push eureka-server
        uses: docker/build-push-action@v5
        with:
          context: ./EurekaServer
          dockerfile: ./EurekaServer/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/eurekaserver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api-gateway:
    name:  Build & Push — api-gateway
    runs-on: ubuntu-latest
    needs: [test-api-gateway]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          dockerfile: ./api-gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-user-service:
    name:  Build & Push — user-service
    runs-on: ubuntu-latest
    needs: [test-user-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./UserService
          dockerfile: ./UserService/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/user-service:latest
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-event-service:
    name:  Build & Push — event-service
    runs-on: ubuntu-latest
    needs: [test-event-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push event-service
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./event-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/event-service:latest
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-notification-service:
    name:  Build & Push — notification-service
    runs-on: ubuntu-latest
    needs: [test-notification-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          dockerfile: ./notification-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/notification-service:latest
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY (Sadece main, tüm build'ler başarıyla bittikten sonra)
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name:  Deploy to Production
    runs-on: ubuntu-latest
    needs:
      - build-eureka
      - build-api-gateway
      - build-user-service
      - build-event-service
      - build-notification-service
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/ems

            # En güncel compose dosyasını çek
            curl -fsSL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose-prod.yml" \
              -o docker-compose-prod.yml

            # Yeni image'ları çek ve container'ları yeniden başlat
            docker compose -f docker-compose-prod.yml pull
            docker compose -f docker-compose-prod.yml up -d --remove-orphans

            # Eski image'ları temizle
            docker image prune -f
