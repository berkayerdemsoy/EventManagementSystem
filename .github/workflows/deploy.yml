name: CI/CD Pipeline

# ─── Tetikleyiciler ────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─── Ortam değişkenleri ────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io

# ─── İzinler ──────────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. BUILD & PUSH — Sadece main branch push'unda çalışır
  # ═══════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push / ${{ matrix.service }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eurekaserver
            dockerfile: EurekaServer/Dockerfile
            context: ./EurekaServer
            needs_secret: false
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: ./api-gateway
            needs_secret: false
          - service: user-service
            dockerfile: UserService/Dockerfile
            context: ./UserService
            needs_secret: true
          - service: event-service
            dockerfile: event-service/Dockerfile
            context: .
            needs_secret: true
          - service: notification-service
            dockerfile: notification-service/Dockerfile
            context: ./notification-service
            needs_secret: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── BuildKit secret mount ──────────────────────────────────────────────
      - name: Build & push (with GitHub Packages secret)
        if: matrix.needs_secret
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GHCR_USERNAME }}/${{ matrix.service }}:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
            github_actor=${{ github.actor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (no secrets needed)
        if: "!matrix.needs_secret"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ vars.GHCR_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. DEPLOY — Sunucudaki /opt/ems klasöründe pull + up yap
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1. Traefik için gerekli SSL dosya kontrolü
            mkdir -p /opt/ems/letsencrypt
            if [ ! -f /opt/ems/letsencrypt/acme.json ]; then
              touch /opt/ems/letsencrypt/acme.json
            fi
            chmod 600 /opt/ems/letsencrypt/acme.json

            # 2. GHCR'a giriş (Yeni imajları çekebilmek için)
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ vars.GHCR_USERNAME }}" --password-stdin

            # 3. Doğru dizine git (Dosyalarının olduğu yer)
            cd /opt/ems

            # 4. Sunucudaki prod dosyası ve .env ile yeni imajları çek
            docker compose -f docker-compose-prod.yml --env-file .env pull

            # 5. Sistemi kesintisiz ayağa kaldır
            docker compose -f docker-compose-prod.yml --env-file .env up -d --remove-orphans

            # 6. Sunucuda biriken eski imajları temizle (Disk dolmasın)
            docker image prune -f