name: CI/CD Pipeline

# ─── Tetikleyiciler ────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─── Ortam değişkenleri ────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  # GHCR_USERNAME → GitHub repo variable olarak tanımla (Settings > Variables > Actions)
  # Secrets'a değil Variables'a koy; kullanıcı adı gizli değil.

# ─── İzinler ──────────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write   # GHCR'a push için

